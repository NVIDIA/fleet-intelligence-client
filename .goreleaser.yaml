#
# GoReleaser configuration for nvfleetctl.
# Docs: https://goreleaser.com
version: 2

project_name: nvfleetctl

before:
  hooks:
    - go mod tidy

builds:
  - id: nvfleetctl
    main: ./cmd/nvfleetctl
    binary: nvfleetctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .CommitDate }}

archives:
  - id: nvfleetctl
    formats: [tar.gz]
    files:
      - LICENSE
      - NOTICE
    # Use zip for Windows.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  groups:
    - title: 'New Features'
      regexp: '.*\bfeat(?:\([^)]+\))?!?:'
      order: 0
    - title: 'Bug Fixes'
      regexp: '.*\bfix(?:\([^)]+\))?!?:'
      order: 1
    - title: 'Documentation Updates'
      regexp: '.*\bdocs(?:\([^)]+\))?!?:'
      order: 2
    - title: 'Maintenance'
      regexp: '.*\b(?:refactor|chore)(?:\([^)]+\))?!?:'
      order: 3
    - title: 'Other Changes'
      order: 999
  filters:
    exclude:
      - '^Merge '
      - '^chore\\(release\\):'
      - '^chore\\(oss\\):'

release:
  github:
    owner: NVIDIA
    name: fleet-intelligence-client
  header: |
    ## NVIDIA Fleet Intelligence Client v{{.Version}}

    This release includes nvfleetctl, the command-line client for NVIDIA Fleet Intelligence.

    ### Available Packages

    - **Binary archives**: Standalone `nvfleetctl` binaries for Linux and Windows on `amd64` and `arm64`
    - **macOS installers**: Developer ID-signed and notarized `.pkg` installers for Intel and Apple Silicon

    ### Installation

    Download the appropriate archive for your system from the assets below. For installation instructions, see the project README.

  footer: |
    ### Verification

    All release artifacts are checksummed. Verify downloads using:
    ```bash
    sha256sum -c checksums.txt
    shasum -a 256 -c checksums-macos.txt
    ```

    ### Support

    For issues and questions, please visit: https://github.com/NVIDIA/fleet-intelligence-client/issues
  draft: false
  prerelease: auto  # Auto-detect pre-release based on version (e.g., v1.0.0-beta)
  mode: replace  # Replace existing release if it exists
  replace_existing_artifacts: true  # Handle reruns where GitHub assets with same name already exist
  skip_upload: false
