# GoReleaser configuration for nvfleetint.
# Docs: https://goreleaser.com
version: 2

project_name: nvfleetint

# No `go mod tidy` hook: the release runner has no egress to proxy.golang.org
# and builds with GOPROXY=off against a module cache seeded by the validate
# job, whereas tidy needs network access to resolve the full module graph.
# The validate job runs the tidiness check instead, where network is available.
builds:
  - id: nvfleetint
    main: ./cmd/nvfleetint
    binary: nvfleetint
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .CommitDate }}
    hooks:
      post:
        - cmd: scripts/sign-macos-binary.sh "{{ .Target }}" "{{ .Path }}"
          output: true
        - cmd: scripts/sign-windows-binary.sh "{{ .Target }}" "{{ .Path }}"
          output: true

archives:
  - id: nvfleetint
    formats: [tar.gz]
    files:
      - LICENSE
      - NOTICE
    # Use zip for macOS and Windows.
    format_overrides:
      - goos: darwin
        formats: [zip]
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  groups:
    - title: 'New Features'
      regexp: '.*\bfeat(?:\([^)]+\))?!?:'
      order: 0
    - title: 'Bug Fixes'
      regexp: '.*\bfix(?:\([^)]+\))?!?:'
      order: 1
    - title: 'Documentation Updates'
      regexp: '.*\bdocs(?:\([^)]+\))?!?:'
      order: 2
    - title: 'Maintenance'
      regexp: '.*\b(?:refactor|chore)(?:\([^)]+\))?!?:'
      order: 3
    - title: 'Other Changes'
      order: 999
  filters:
    exclude:
      - '^Merge '
      - '^chore\\(release\\):'
      - '^chore\\(oss\\):'

release:
  github:
    owner: NVIDIA
    name: fleet-intelligence-client
  header: |
    ## NVIDIA Fleet Intelligence Client v{{.Version}}

    This release includes nvfleetint, the command-line client for NVIDIA Fleet Intelligence.

    ### Available Packages

    - **Linux archives**: Standalone binaries with SHA-256 checksums on `amd64` and `arm64`
    - **Windows archives**: Authenticode-signed binaries on `amd64` and `arm64`
    - **macOS archives**: Developer ID-signed and notarized `.zip` archives for Intel and Apple Silicon

    ### Installation

    Download the appropriate archive for your system from the assets below. For installation instructions, see the project README.

  footer: |
    ### Verification

    All release artifacts are checksummed. Verify downloads using:
    ```bash
    sha256sum -c checksums.txt
    ```

    Confirm that `fleet-intelligence.pub.asc` has fingerprint
    `FE0C 8B74 CA66 357C 13BE 197D CCE3 C963 0871 99B3`, then authenticate
    the checksum manifest:
    ```bash
    gpg --import fleet-intelligence.pub.asc
    gpg --verify checksums.txt.asc checksums.txt
    ```

    ### Support

    For issues and questions, please visit: https://github.com/NVIDIA/fleet-intelligence-client/issues
  # The workflow publishes this draft only after Apple accepts both macOS ZIPs.
  draft: true
  prerelease: auto  # Auto-detect pre-release based on version (e.g., v1.0.0-beta)
  mode: replace  # Replace existing release if it exists
  use_existing_draft: true  # Reuse a draft left by a failed or rerun workflow
  replace_existing_artifacts: true  # Handle reruns where GitHub assets with same name already exist
  skip_upload: false
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1
