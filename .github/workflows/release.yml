name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Test release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          check-latest: true
          cache: false

      - name: Run tests
        run: make test-coverage

  goreleaser:
    name: Build, sign, and create draft release
    needs: validate
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          check-latest: true
          cache: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install nvsec
        run: |
          python -m venv "$RUNNER_TEMP/nvsec-venv"
          "$RUNNER_TEMP/nvsec-venv/bin/pip" install nvsec \
            --index-url "$NVSEC_PYPI_INDEX_URL" \
            --extra-index-url "https://urm.nvidia.com/artifactory/api/pypi/sw-cftt-pypi-local/simple"
          echo "$RUNNER_TEMP/nvsec-venv/bin" >> "$GITHUB_PATH"
        env:
          NVSEC_PYPI_INDEX_URL: ${{ secrets.NVSEC_PYPI_INDEX_URL }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "v2.17.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_MACOS_BINARIES: "true"
          SIGN_WINDOWS_BINARIES: "true"
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
          NVSEC_MACOS_SSA_SCOPE: ${{ vars.NVSEC_MACOS_SSA_SCOPE || 'SIGNING_MACOS' }}
          NVSEC_WINDOWS_SSA_SCOPE: ${{ vars.NVSEC_WINDOWS_SSA_SCOPE || 'SIGNING_WINDOWS_AUTH' }}
          NVSEC_WINDOWS_JOB_TYPE: ${{ vars.NVSEC_WINDOWS_JOB_TYPE || 'WINDOWS_AUTH' }}
          NSPECT_ID: ${{ vars.NSPECT_ID }}

      - name: Sign and verify checksum manifest
        run: |
          scripts/sign-checksum-manifest.sh \
            dist/checksums.txt \
            release/keys/fleet-intelligence.pub.asc
        env:
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
          NVSEC_CHECKSUM_SSA_SCOPE: ${{ vars.NVSEC_CHECKSUM_SSA_SCOPE || 'SIGNING_FLEET_INTELLIGENCE' }}
          NVSEC_CHECKSUM_JOB_TYPE: ${{ vars.NVSEC_CHECKSUM_JOB_TYPE || 'FLEET_INTELLIGENCE' }}
          NSPECT_ID: ${{ vars.NSPECT_ID }}

      - name: Prepare checksum verification assets
        run: |
          mkdir -p checksum-verification-assets
          install -m 0644 \
            dist/checksums.txt.asc \
            release/keys/fleet-intelligence.pub.asc \
            checksum-verification-assets/

      - name: Upload checksum verification assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksum-verification-assets
          path: checksum-verification-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed macOS archives for notarization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos-archives
          path: dist/nvfleetctl_*_darwin_*.zip
          if-no-files-found: error
          retention-days: 7

  macos-notarize:
    name: Notarize macOS archives
    needs: goreleaser
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download signed macOS archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-macos-archives
          path: signed-archives

      - name: Notarize macOS archives
        run: scripts/notarize-macos-archives.sh "$GITHUB_REF_NAME" signed-archives notarized-archives
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_PROFILE: ${{ vars.APPLE_NOTARY_PROFILE || 'fleetint-notarytool' }}
          APPLE_TEAM_ID: 6KR3T733EC

      - name: Upload notarized macOS archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notarized-macos-archives
          path: notarized-archives/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated release
    needs: [goreleaser, macos-notarize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download notarized macOS archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notarized-macos-archives
          path: notarized-archives

      - name: Download checksum verification assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checksum-verification-assets
          path: checksum-verification-assets

      - name: Replace macOS archives and publish release
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            notarized-archives/* \
            checksum-verification-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
