name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Test release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          check-latest: true
          cache: false

      - name: Run tests
        run: make test-coverage

  goreleaser:
    name: Sign and publish Linux and Windows
    needs: [validate, macos-notarize]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          check-latest: true
          cache: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install nvsec
        run: |
          python -m venv "$RUNNER_TEMP/nvsec-venv"
          "$RUNNER_TEMP/nvsec-venv/bin/pip" install nvsec \
            --index-url "https://gitlab-master.nvidia.com/api/v4/projects/25923/packages/pypi/simple" \
            --extra-index-url "https://urm.nvidia.com/artifactory/api/pypi/sw-cftt-pypi-local/simple"
          echo "$RUNNER_TEMP/nvsec-venv/bin" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_WINDOWS_BINARIES: "true"
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
          NVSEC_SSA_SCOPE: ${{ vars.NVSEC_WINDOWS_SSA_SCOPE || 'SIGNING_WINDOWS_AUTHENTICODE' }}
          NVSEC_WINDOWS_JOB_TYPE: ${{ vars.NVSEC_WINDOWS_JOB_TYPE || 'WINDOWS_AUTH' }}
          NSPECT_ID: ${{ vars.NSPECT_ID }}

  macos-build-sign:
    name: Build and sign macOS binaries
    needs: validate
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          check-latest: true
          cache: false

      - name: Cross-build macOS binaries
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: build --clean --config .goreleaser-macos.yaml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install nvsec
        run: |
          python -m venv "$RUNNER_TEMP/nvsec-venv"
          "$RUNNER_TEMP/nvsec-venv/bin/pip" install nvsec \
            --index-url "https://gitlab-master.nvidia.com/api/v4/projects/25923/packages/pypi/simple" \
            --extra-index-url "https://urm.nvidia.com/artifactory/api/pypi/sw-cftt-pypi-local/simple"
          echo "$RUNNER_TEMP/nvsec-venv/bin" >> "$GITHUB_PATH"

      - name: Sign macOS binaries with 3S
        run: scripts/sign-macos-binaries.sh "$GITHUB_REF_NAME" dist/macos signed-binaries
        env:
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
          NVSEC_SSA_SCOPE: SIGNING_MACOS
          NSPECT_ID: ${{ vars.NSPECT_ID }}

      - name: Upload signed macOS binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos-binaries
          path: signed-binaries/*
          if-no-files-found: error
          retention-days: 7

  macos-package:
    name: Build macOS packages
    needs: macos-build-sign
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download signed macOS binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-macos-binaries
          path: signed-binaries

      - name: Build unsigned macOS packages
        run: scripts/build-macos-packages.sh "$GITHUB_REF_NAME" signed-binaries unsigned-packages

      - name: Upload unsigned macOS packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-macos-packages
          path: unsigned-packages/*.pkg
          if-no-files-found: error
          retention-days: 7

  macos-sign-packages:
    name: Sign macOS packages
    needs: macos-package
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install nvsec
        run: |
          python -m venv "$RUNNER_TEMP/nvsec-venv"
          "$RUNNER_TEMP/nvsec-venv/bin/pip" install nvsec \
            --index-url "https://gitlab-master.nvidia.com/api/v4/projects/25923/packages/pypi/simple" \
            --extra-index-url "https://urm.nvidia.com/artifactory/api/pypi/sw-cftt-pypi-local/simple"
          echo "$RUNNER_TEMP/nvsec-venv/bin" >> "$GITHUB_PATH"

      - name: Download unsigned macOS packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-macos-packages
          path: unsigned-packages

      - name: Sign macOS packages with 3S
        run: scripts/sign-macos-packages.sh "$GITHUB_REF_NAME" unsigned-packages signed-packages
        env:
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
          NVSEC_SSA_SCOPE: SIGNING_MACOS
          NSPECT_ID: ${{ vars.NSPECT_ID }}

      - name: Upload signed macOS packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos-packages
          path: signed-packages/*.pkg
          if-no-files-found: error
          retention-days: 7

  macos-notarize:
    name: Notarize macOS packages
    needs: macos-sign-packages
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download signed macOS packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-macos-packages
          path: signed-packages

      - name: Notarize macOS packages
        run: scripts/notarize-macos-packages.sh "$GITHUB_REF_NAME" signed-packages notarized-packages
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_PROFILE: ${{ vars.APPLE_NOTARY_PROFILE }}
          APPLE_TEAM_ID: 6KR3T733EC

      - name: Upload notarized macOS packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notarized-macos-packages
          path: notarized-packages/*
          if-no-files-found: error
          retention-days: 7

  publish-macos:
    name: Publish macOS packages
    needs: [goreleaser, macos-notarize]
    runs-on: ubuntu-latest
    steps:
      - name: Download notarized macOS packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notarized-macos-packages
          path: notarized-packages

      - name: Upload macOS packages to the GitHub release
        run: gh release upload "$GITHUB_REF_NAME" notarized-packages/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
