name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Test release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: false

      - name: Run tests
        run: make test-coverage

      # GoReleaser no longer runs `go mod tidy`, so assert tidiness here, where
      # the runner actually has network access to resolve the module graph.
      - name: Verify go.mod and go.sum are tidy
        run: |
          set -euo pipefail
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          if ! diff -q go.mod go.mod.orig >/dev/null || ! diff -q go.sum go.sum.orig >/dev/null; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result" >&2
            diff -u go.mod.orig go.mod || true
            diff -u go.sum.orig go.sum || true
            exit 1
          fi
          rm -f go.mod.orig go.sum.orig

      # The self-hosted release runner has no egress to proxy.golang.org, so it
      # cannot populate its own module cache — a dependency bump that lands
      # after its cache was last warm fails the release. Seed it from here,
      # where the modules have just been downloaded to run the tests.
      - name: Package module cache for the release runner
        run: |
          set -euo pipefail
          go mod download
          tar -C "$(go env GOMODCACHE)/cache" -cf go-mod-cache.tar download
          ls -lh go-mod-cache.tar

      - name: Upload module cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-module-cache
          path: go-mod-cache.tar
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    name: Build, sign, and create draft release
    needs: validate
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: false

      - name: Verify nvsec is available
        run: |
          command -v nvsec >/dev/null 2>&1 || {
            echo "nvsec must be installed on the self-hosted release runner" >&2
            exit 1
          }

      # Staged under runner.temp, not the working tree: GoReleaser refuses to
      # build from a dirty git state, and an untracked directory counts.
      - name: Download module cache
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-module-cache
          path: ${{ runner.temp }}/go-mod-cache

      # --skip-old-files: only add modules this runner is missing. Cached module
      # files are mode 0444, so overwriting them in place would fail.
      - name: Seed Go module cache
        run: |
          set -euo pipefail
          mkdir -p "$(go env GOMODCACHE)/cache"
          tar -C "$(go env GOMODCACHE)/cache" \
            --skip-old-files -xf "$RUNNER_TEMP/go-mod-cache/go-mod-cache.tar"
          rm -rf "$RUNNER_TEMP/go-mod-cache"
          go mod verify
          git status --porcelain
        env:
          GOFLAGS: -mod=mod
          GOPROXY: "off"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "v2.17.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail fast and loudly on a cache miss instead of hanging on a TLS
          # handshake the runner's network will never complete.
          GOFLAGS: -mod=mod
          GOPROXY: "off"
          SIGN_MACOS_BINARIES: "true"
          SIGN_WINDOWS_BINARIES: "true"
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
          NVSEC_MACOS_SSA_SCOPE: ${{ vars.NVSEC_MACOS_SSA_SCOPE || 'SIGNING_MACOS' }}
          NVSEC_WINDOWS_SSA_SCOPE: ${{ vars.NVSEC_WINDOWS_SSA_SCOPE || 'SIGNING_WINDOWS_AUTH' }}
          NVSEC_WINDOWS_JOB_TYPE: ${{ vars.NVSEC_WINDOWS_JOB_TYPE || 'WINDOWS_AUTH' }}
          NSPECT_ID: ${{ vars.NSPECT_ID }}

      - name: Sign and verify checksum manifest
        run: |
          scripts/sign-checksum-manifest.sh \
            dist/checksums.txt \
            release/keys/fleet-intelligence.pub.asc
        env:
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
          NVSEC_CHECKSUM_SSA_SCOPE: ${{ vars.NVSEC_CHECKSUM_SSA_SCOPE || 'SIGNING_FLEET_INTELLIGENCE' }}
          NVSEC_CHECKSUM_JOB_TYPE: ${{ vars.NVSEC_CHECKSUM_JOB_TYPE || 'FLEET_INTELLIGENCE' }}
          NSPECT_ID: ${{ vars.NSPECT_ID }}

      - name: Prepare checksum verification assets
        run: |
          mkdir -p checksum-verification-assets
          install -m 0644 \
            dist/checksums.txt.asc \
            release/keys/fleet-intelligence.pub.asc \
            checksum-verification-assets/

      - name: Upload checksum verification assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksum-verification-assets
          path: checksum-verification-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed macOS archives for notarization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos-archives
          path: dist/nvfleetctl_*_darwin_*.zip
          if-no-files-found: error
          retention-days: 7

  macos-notarize:
    name: Notarize macOS archives
    needs: goreleaser
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download signed macOS archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-macos-archives
          path: signed-archives

      - name: Notarize macOS archives
        run: scripts/notarize-macos-archives.sh "$GITHUB_REF_NAME" signed-archives notarized-archives
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_PROFILE: ${{ vars.APPLE_NOTARY_PROFILE || 'fleetint-notarytool' }}
          APPLE_TEAM_ID: 6KR3T733EC

      - name: Upload notarized macOS archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notarized-macos-archives
          path: notarized-archives/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated release
    needs: [goreleaser, macos-notarize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download notarized macOS archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notarized-macos-archives
          path: notarized-archives

      - name: Download checksum verification assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checksum-verification-assets
          path: checksum-verification-assets

      - name: Replace macOS archives and publish release
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            notarized-archives/* \
            checksum-verification-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
