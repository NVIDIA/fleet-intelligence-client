name: Documentation - New Documentation Request
description: Request additions to nvfleetctl documentation
title: "[DOC]: "
labels: ["doc"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to improve our documentation!

  - type: dropdown
    id: criticality
    attributes:
      label: How would you describe the priority of this documentation request
      options:
        - Critical (currently preventing usage)
        - High
        - Medium
        - Low (would be nice)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Describe the missing documentation
      placeholder: I need an example showing how to verify a signed report with a local public key.
    validations:
      required: true

  - type: textarea
    id: search_locs
    attributes:
      label: Where have you looked?
      placeholder: |
       https://github.com/NVIDIA/fleet-intelligence-client/blob/main/README.md

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/NVIDIA/fleet-intelligence-client/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow nvfleetctl's Code of Conduct
          required: true
        - label: I have searched the project's documentation and have found no duplicates for this documentation request
          required: true
