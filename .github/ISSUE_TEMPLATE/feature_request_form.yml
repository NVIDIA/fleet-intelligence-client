name: Feature Request Form
description: Request new or improved functionality or changes to existing functionality
title: "[FEA]: "
labels: ["feature request"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

  - type: dropdown
    id: new_or_improvement
    attributes:
      label: Is this a new feature, an improvement, or a change to existing functionality?
      options:
        - New Feature
        - Improvement
        - Change
    validations:
      required: true

  - type: dropdown
    id: criticality
    attributes:
      label: How would you describe the priority of this feature request
      options:
        - Critical (currently preventing usage)
        - High
        - Medium
        - Low (would be nice)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem this feature would solve. Real usage examples are especially helpful.
    validations:
      required: true

  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: Describe the behavior you want to add or change.
      placeholder: >
        As an operator, I want to filter nodes by tag so that I can inspect one
        workload or tenant at a time.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe your ideal solution
      description: Please describe the functionality you would like added.
      placeholder: >
        Add `nvfleetctl node list --tag key=value` and the matching SDK option.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe any alternatives you have considered
      description: List any other libraries, or approaches you have looked at or tried.
      placeholder: I currently export JSON and filter it locally with jq.

  - type: textarea
    id: misc
    attributes:
      label: Additional context
      description: Add any other context, code examples, or references to existing implementations about the feature request here. If applicable, please list the modules affected.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/NVIDIA/fleet-intelligence-client/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow nvfleetctl's Code of Conduct
          required: true
        - label: I have searched the [open feature requests](https://github.com/NVIDIA/fleet-intelligence-client/issues?q=is%3Aopen+is%3Aissue+label%3A%22feature+request%22%2Cimprovement%2Cenhancement) and have found no duplicates for this feature request
          required: true
