  /v1/reports/error:
    get:
      description: 'Get error report grouped by error type or node in JSON or CSV
        format. Default response is JSON. For CSV download (list view only), set format=csv
        query parameter. Response structure varies based on view and groupBy parameters:

        - When view=list and groupBy=error: The ''errors'' field is populated with
        paginated list

        - When view=list and groupBy=node: The ''nodes'' field is populated with paginated
        list

        - When view=graph and groupBy=error: Returns time-series data with optional
        step parameter (page and pageSize not used)

        - When view=overview: Returns aggregate statistics (groupBy parameter not
        required, page and pageSize not used)'
      operationId: getV1ReportsError
      parameters:
        - description: Group by error or node (not required for overview view)
          in: query
          name: groupBy
          schema:
            enum:
              - error
              - node
            type: string
        - description: 'View type: list, graph, or overview'
          in: query
          name: view
          required: true
          schema:
            enum:
              - list
              - graph
              - overview
            type: string
        - description: Response format (json or csv, only for list view)
          in: query
          name: format
          schema:
            default: json
            enum:
              - json
              - csv
            type: string
        - description: Page number (0-indexed). Not used for CSV format, graph view,
            or overview view
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Page size. Not used for CSV format, graph view, or overview
            view
          in: query
          name: pageSize
          schema:
            default: 10
            type: integer
        - description: Query resolution step width in duration format (e.g. 1h, 1m).
            Only used for graph view. If not provided, backend will choose a suitable
            step width. Minimum step width is 1 minute.
          in: query
          name: step
          schema:
            type: string
        - description: Filter by computezone IDs. Empty means all computezones
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by nodegroup IDs. Empty means all nodegroups
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by tags (AND logic - matches nodes with ANY of the specified
            tags). Empty means all nodes
          in: query
          name: tags
          schema:
            items:
              type: string
            type: array
        - description: 'Filter nodes by specific error types (only for list view,
            groupBy=node). Returns ALL errors for nodes that have any of the specified
            errors. Examples: ''NVSwitch Fatal Error'', ''xid_154'''
          in: query
          name: errors
          schema:
            items:
              type: string
            type: array
        - description: Filter errors by severity. Empty means all severities
          in: query
          name: severities
          schema:
            items:
              $ref: '#/components/schemas/models.EventSeverity'
            type: array
        - description: 'Time mode: ''absolute'' (default) or ''relative''. Absolute
            requires start/end; relative requires window'
          in: query
          name: timeMode
          schema:
            type: string
        - description: Relative time window (e.g., 1h, 1m, 30s). Only used when timeMode=relative
          in: query
          name: window
          schema:
            type: string
        - description: Start time for filtering errors (RFC3339 format). Required
            when timeMode=absolute
          in: query
          name: startTime
          schema:
            type: string
        - description: End time for filtering errors (RFC3339 format). Required when
            timeMode=absolute
          in: query
          name: endTime
          schema:
            type: string
