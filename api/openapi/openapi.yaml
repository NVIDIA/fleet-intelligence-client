  /v1/reports/error:
    get:
      description: 'Get error report grouped by error type or node in JSON or CSV
        format. Default response is JSON. For CSV download (list view only), set format=csv
        query parameter. Response structure varies based on view and groupBy parameters:

        - When view=list and groupBy=error: The ''errors'' field is populated with
        paginated list

        - When view=list and groupBy=node: The ''nodes'' field is populated with paginated
        list

        - When view=graph and groupBy=error: Returns time-series data with optional
        step parameter (page and pageSize not used)

        - When view=overview: Returns aggregate statistics (groupBy parameter not
        required, page and pageSize not used)'
      operationId: getV1ReportsError
      parameters:
        - description: Group by error or node (not required for overview view)
          in: query
          name: groupBy
          schema:
            enum:
              - error
              - node
            type: string
        - description: 'View type: list, graph, or overview'
          in: query
          name: view
          required: true
          schema:
            enum:
              - list
              - graph
              - overview
            type: string
        - description: Response format (json or csv, only for list view)
          in: query
          name: format
          schema:
            default: json
            enum:
              - json
              - csv
            type: string
        - description: Page number (0-indexed). Not used for CSV format, graph view,
            or overview view
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Page size. Not used for CSV format, graph view, or overview
            view
          in: query
          name: pageSize
          schema:
            default: 10
            type: integer
        - description: Query resolution step width in duration format (e.g. 1h, 1m).
            Only used for graph view. If not provided, backend will choose a suitable
            step width. Minimum step width is 1 minute.
          in: query
          name: step
          schema:
            type: string
        - description: Filter by computezone IDs. Empty means all computezones
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by nodegroup IDs. Empty means all nodegroups
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by tags (AND logic - matches nodes with ANY of the specified
            tags). Empty means all nodes
          in: query
          name: tags
          schema:
            items:
              type: string
            type: array
        - description: 'Filter nodes by specific error types (only for list view,
            groupBy=node). Returns ALL errors for nodes that have any of the specified
            errors. Examples: ''NVSwitch Fatal Error'', ''xid_154'''
          in: query
          name: errors
          schema:
            items:
              type: string
            type: array
        - description: Filter errors by severity. Empty means all severities
          in: query
          name: severities
          schema:
            items:
              $ref: '#/components/schemas/models.EventSeverity'
            type: array
        - description: 'Time mode: ''absolute'' (default) or ''relative''. Absolute
            requires start/end; relative requires window'
          in: query
          name: timeMode
          schema:
            type: string
        - description: Relative time window (e.g., 1h, 1m, 30s). Only used when timeMode=relative
          in: query
          name: window
          schema:
            type: string
        - description: Start time for filtering errors (RFC3339 format). Required
            when timeMode=absolute
          in: query
          name: startTime
          schema:
            type: string
        - description: End time for filtering errors (RFC3339 format). Required when
            timeMode=absolute
          in: query
          name: endTime
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/models.ByErrorResponse'
                  - $ref: '#/components/schemas/models.ByNodeResponse'
                  - $ref: '#/components/schemas/models.ErrorOverviewResponse'
                  - $ref: '#/components/schemas/models.ErrorReportGraphByErrorResponse'
            text/csv:
              schema:
                type: string
          description: Graph response grouped by error (view=graph, groupBy=error)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Service Unavailable
      summary: Get error report
      tags:
        - reports
  /v1/reports/inventory:
    get:
      description: 'Get an agent-source-specific inventory report in JSON or CSV format.
        dataSource=inband preserves the existing GPU/OS inventory shape; dataSource=oob
        returns the shared report fields plus nodeName, bmcHostname, and bmcIP. GPU
        type and count come from the selected source.

        Default response is JSON. For CSV download, set format=csv. For a signed CSV
        bundle (CSV plus a cosign-verifiable signature, packaged as a zip), set format=csv
        and signed=true.

        Each node includes enrolledAt (original enrollment time, preserved across
        re-enrollment) and removedAt (soft-delete time for removed nodes, manual and
        auto-removed alike; absent for active nodes).

        JSON responses include the preferred location and verification-check fields
        plus the deprecated geoLocation/integrityCheck aliases for backward compatibility.'
      operationId: getV1ReportsInventory
      parameters:
        - description: Page number (0-indexed). Not used for CSV format
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Page size. Not used for CSV format
          in: query
          name: pageSize
          schema:
            default: 10
            type: integer
        - description: Response format (json or csv)
          in: query
          name: format
          schema:
            default: json
            enum:
              - json
              - csv
            type: string
        - description: Sign the CSV with NVIDIA's signing key and return a zip containing
            the CSV plus a .sig.bundle (cosign-verifiable Sigstore bundle). Only valid
            with format=csv.
          in: query
          name: signed
          schema:
            default: false
            type: boolean
        - description: 'Inventory source: inband (default) or oob. The JSON and CSV
            fields are source-specific.'
          in: query
          name: dataSource
          schema:
            default: inband
            enum:
              - inband
              - oob
            type: string
        - description: 'Deprecated: use dataSource. When both parameters are supplied,
            their values must match.'
          in: query
          name: agentType
          schema:
            enum:
              - inband
              - oob
            type: string
          deprecated: true
        - description: Filter by computezone IDs. Empty means all computezones
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by nodegroup IDs. Empty means all nodegroups
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by tags. Empty means all tags
          in: query
          name: tags
          schema:
            items:
              type: string
            type: array
        - description: Start time for filtering nodes active during period (RFC3339
            format, e.g., 2024-01-01T00:00:00Z)
          in: query
          name: startTime
          schema:
            type: string
        - description: End time for filtering nodes active during period (RFC3339
            format, e.g., 2024-12-31T23:59:59Z)
          in: query
          name: endTime
          schema:
            type: string
        - description: 'Field to sort by. In-band fields: hostname, publicIP, privateIP.
            OOB fields: nodeName, bmcHostname, bmcIP. Shared fields: nodeUUID, nodeGroup,
            computeZone, gpuType, gpuCount, verificationCheck, location. integrityCheck
            and geoLocation remain deprecated aliases. Defaults to hostname for inband
            and bmcHostname for oob.'
          in: query
          name: sortBy
          schema:
            enum:
              - hostname
              - nodeUUID
              - nodeGroup
              - computeZone
              - gpuType
              - gpuCount
              - publicIP
              - privateIP
              - nodeName
              - bmcHostname
              - bmcIP
              - verificationCheck
              - location
              - integrityCheck
              - geoLocation
            type: string
        - description: Sort order (asc, desc)
          in: query
          name: order
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/models.InbandInventoryReportResponse'
                  - $ref: '#/components/schemas/models.OobInventoryReportResponse'
            application/zip:
              schema:
                format: binary
                type: string
            text/csv:
              schema:
                type: string
          description: OOB JSON response (dataSource=oob). CSV responses use a source-specific
            header; signed CSV returns application/zip.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Service Unavailable
