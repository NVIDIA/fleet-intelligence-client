info:
  title: Fleet Intelligence API (external)
  version: ''
externalDocs:
  description: OpenAPI specification
  url: /fleet-intelligence/public/openapi.json
openapi: 3.1.0
paths:
  /.well-known/signing-key.pub:
    get:
      description: Returns NVIDIA's currently-active public key for verifying signed
        inventory reports. Use with `cosign verify-blob --key signing-key.pub --bundle
        <file>.sig.bundle <file>.csv`. The key is PEM-encoded (PKIX SubjectPublicKeyInfo).
        After a key rotation this URL serves the new key; reports signed under previous
        keys cease to verify and customers must re-download.
      responses:
        '200':
          content:
            application/x-pem-file:
              schema:
                type: string
          description: PEM-encoded ECDSA-P256 public key
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Signing not configured or temporarily unavailable
      summary: Get inventory-report public verification key
      tags:
        - reports
  /v1/alert_mute_rules:
    delete:
      description: 'Delete mute rules for a specific component, or delete all mute
        rules for the customer.

        With body: provide component (required) and optionally severities. If severities
        is empty, deletes all rules for the component.

        Without body: deletes ALL mute rules for the customer.'
      operationId: deleteV1AlertMuteRules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.DeleteMuteRulesRequest'
              summary: request
              description: Delete mute rules request (omit body to delete all)
        description: Delete mute rules request (omit body to delete all)
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Not Found - No rules exist for the specified component
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Delete mute rules
      tags:
        - alert_mute_rules
    get:
      description: Get all customer-wide mute rules grouped by component. Each component
        shows which severities (Critical, Warning) are muted.
      operationId: getV1AlertMuteRules
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ListMuteRulesResponse'
          description: List of mute rules grouped by component
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: List mute rules
      tags:
        - alert_mute_rules
    put:
      description: 'Declarative per-component update: set this component to exactly
        the specified severities.

        If severities is empty or omitted, defaults to both Critical and Warning.

        This replaces any existing mute configuration for the component.

        Returns 204 No Content on success. Use GET /v1/alert_mute_rules to retrieve
        current state.'
      operationId: putV1AlertMuteRules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.UpdateMuteRuleRequest'
              summary: request
              description: Update mute rule request
        description: Update mute rule request
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Update mute rule for a component
      tags:
        - alert_mute_rules
  /v1/alert_timeline/filter_options:
    get:
      description: Get the set of filter values (GPU types, node groups, compute zones,
        component types, alert states) available for the alert panel, returned in
        the shared options envelope (filters.fields[] + sorting) used by the node
        and node-group options endpoints. Every value is scoped to the customer's
        alerts in the chosen view, so each option is guaranteed to return results
        when applied as a filter. Use the 'active' parameter to switch between the
        Active and Historical views; the historical view may additionally surface
        the Resolved alert state. Object-valued options ({id, value}) carry the filter
        id and its display value (node group / compute zone ids and names; component
        identifier and display name); gpuTypes and alertStates are plain strings.
        The sorting block advertises the Level 1 nodes-list sort columns. componentVisibility
        is resolved server-side from the caller's persona.
      operationId: getV1AlertTimelineFilterOptions
      parameters:
        - description: 'Active Alerts view when true; Historical Alerts when false
            (default: false)'
          in: query
          name: active
          schema:
            default: false
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Options'
          description: Available filter options (and sorting metadata) scoped to the
            view, in the shared options envelope
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get filter dropdown options for the alert panel
      tags:
        - alerts
  /v1/alert_timeline/nodes:
    get:
      description: Returns a paginated list of nodes with per-node alert counts and
        inventory metadata for the Alerts panel. Use active=true for the Active Alerts
        view (only nodes with currently active alerts) or active=false for Historical
        Alerts. Cross-page aggregates (totalCritical, totalWarning, distinctGpuTypeCount,
        etc.) reflect the full filtered result set and drive table header counts.
        componentVisibility is resolved server-side from the user's auth persona and
        is not an HTTP parameter.
      operationId: getV1AlertTimelineNodes
      parameters:
        - description: 'Active Alerts view when true; Historical Alerts when false
            (default: false)'
          in: query
          name: active
          schema:
            default: false
            type: boolean
        - description: Page number (0-indexed)
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Number of nodes per page
          in: query
          name: pageSize
          schema:
            default: 50
            type: integer
        - description: Case-insensitive partial match on hostname
          in: query
          name: hostname
          schema:
            type: string
        - description: When true, return only nodes whose liveness state is Healthy/Degraded
            and has no unhealthy in-band or OOB liveness state. Omit or use false
            to return all nodes.
          in: query
          name: onlineOnly
          schema:
            default: false
            type: boolean
        - description: Sortable table-header column. alert ranks by critical then
            warning count.
          in: query
          name: sortBy
          schema:
            default: alert
            enum:
              - hostname
              - alert
              - gpuType
              - nodeGroup
              - computeZone
              - lastUpdate
            type: string
        - description: Sort direction for sortBy
          in: query
          name: order
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - description: Filter to nodes with matching GPU types (OR within dimension)
          in: query
          name: gpuTypes
          schema:
            items:
              type: string
            type: array
        - description: Filter to nodes in matching node groups by node group ID (OR
            within dimension)
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Filter to nodes in matching compute zones by compute zone ID
            (OR within dimension)
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Filter to nodes with at least one alert whose state matches
            (OR within dimension). Resolved applies to the Historical view only (active=false).
          in: query
          name: alertStates
          schema:
            items:
              enum:
                - Critical
                - Warning
                - Resolved
              type: string
            type: array
        - description: Filter to nodes with alerts on matching component types. Use
            the value 'psirt' to match all security-vulnerability CVEs (the collapsed
            'Security Vulnerability' option).
          in: query
          name: componentTypes
          schema:
            items:
              type: string
            type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AlertTimelineNodesResponse'
          description: List of nodes with alert summary
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request - Invalid parameters
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: List impacted machines with alert summary (level 1)
      tags:
        - alerts
  /v1/alert_timeline/nodes/{nodeUUID}/alerts:
    get:
      description: Get list of alerts for a specific node. Returns alert UUID, component,
        alert status, start time, and last event time. Use the 'active' parameter
        to switch between active and historical views. The sortable table-header columns
        and the filter dimensions mirror the Level 1 nodes list, so the panel can
        forward the same filter set unchanged.
      operationId: getV1AlertTimelineNodesNodeUuidAlerts
      parameters:
        - description: Node UUID
          in: path
          name: nodeUUID
          required: true
          schema:
            type: string
        - description: 'Active Alerts view when true; Historical Alerts when false
            (default: false)'
          in: query
          name: active
          schema:
            default: false
            type: boolean
        - description: 'Exclude PSIRT alerts from results (default: false)'
          in: query
          name: withoutPsirt
          schema:
            default: false
            type: boolean
        - description: Sortable table-header column.
          in: query
          name: sortBy
          schema:
            default: lastUpdate
            enum:
              - startTime
              - lastUpdate
            type: string
        - description: Sort direction for sortBy
          in: query
          name: order
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - description: Filter to alerts whose state matches (OR within dimension),
            carried from the Level 1 filter. Resolved applies to the Historical view
            only (active=false).
          in: query
          name: alertStates
          schema:
            items:
              enum:
                - Critical
                - Warning
                - Resolved
              type: string
            type: array
        - description: Filter to alerts on matching component types. Use the value
            'psirt' to match all security-vulnerability CVEs (the collapsed 'Security
            Vulnerability' option).
          in: query
          name: componentTypes
          schema:
            items:
              type: string
            type: array
        - description: 'Node-level filter carried from Level 1: match the node''s
            GPU type (OR within dimension)'
          in: query
          name: gpuTypes
          schema:
            items:
              type: string
            type: array
        - description: 'Node-level filter carried from Level 1: match the node''s
            node group by ID (OR within dimension)'
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: 'Node-level filter carried from Level 1: match the node''s
            compute zone by ID (OR within dimension)'
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Page number (0-indexed)
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Number of alerts per page
          in: query
          name: pageSize
          schema:
            default: 50
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AlertTimelineNodeAlertsResponse'
          description: List of alerts for the node
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request - Invalid UUID or query parameters
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Node Not Found
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get alerts for a specific node (level 2)
      tags:
        - alerts
  /v1/alert_timeline/nodes/{nodeUUID}/alerts/{alertUUID}:
    get:
      description: 'Get complete timeline for a specific alert. Returns alert UUID,
        component, current alertStatus, nodeGroup, computeZone, and complete event
        timeline. This is the third level of the progressive disclosure API for alert
        timelines. Events default to newest-first (most recent update first); pass
        order=asc for chronological (oldest-first) order. Pagination of the timeline
        events is optional and backward compatible: omit pageSize to receive the full
        timeline (default); supply pageSize to page through the events, in which case
        the response also carries page/pageSize/total/hasMore metadata.'
      operationId: getV1AlertTimelineNodesNodeUuidAlertsAlertUuid
      parameters:
        - description: Node UUID
          in: path
          name: nodeUUID
          required: true
          schema:
            type: string
        - description: Alert UUID
          in: path
          name: alertUUID
          required: true
          schema:
            type: string
        - description: 'Sort direction on event time: ''desc'' (default, most recent
            update first) or ''asc'' (chronological, oldest first)'
          in: query
          name: order
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - description: 'Page number (0-indexed). Only applied when pageSize is supplied,
            but always validated: an invalid value returns 400 either way'
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Timeline events per page. Omit for the full, unpaginated timeline
            (default behavior)
          in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AlertTimelineDetailResponse'
          description: Complete timeline for the alert
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request - Invalid UUID format
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Alert Not Found
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get complete timeline for a specific alert (level 3)
      tags:
        - alerts
  /v1/alerts:
    get:
      description: Get list of alerts with optional filtering by node, component,
        state, and severity
      operationId: getV1Alerts
      parameters:
        - description: Filter by node UUID
          in: query
          name: nodeUUID
          schema:
            type: string
        - description: Filter by component name
          in: query
          name: component
          schema:
            type: string
        - description: Filter by alert state (Detected, Triggered, Resolved)
          in: query
          name: state
          schema:
            type: string
        - description: Filter by alert severity (Critical, Warning)
          in: query
          name: severity
          schema:
            type: string
        - description: Page number (0-indexed)
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Page size
          in: query
          name: pageSize
          schema:
            default: 50
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AlertResponse'
          description: Array of alerts with pagination info
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get alerts
      tags:
        - alerts
  /v1/alerts/{nodeUUID}:
    get:
      description: Get list of alerts for a specific node (machine) identified by
        nodeUUID, grouped by component
      operationId: getV1AlertsNodeUuid
      parameters:
        - description: Node UUID (machine ID)
          in: path
          name: nodeUUID
          required: true
          schema:
            type: string
        - description: Filter by component name
          in: query
          name: component
          schema:
            type: string
        - description: Filter by alert state (Detected, Triggered, Resolved)
          in: query
          name: state
          schema:
            type: string
        - description: Filter by alert severity (Critical, Warning)
          in: query
          name: severity
          schema:
            type: string
        - description: Page number (0-indexed)
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Page size
          in: query
          name: pageSize
          schema:
            default: 50
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.NodeAlertResponse'
          description: Alerts grouped by component with pagination info
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Node Not Found
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get alerts for a specific node
      tags:
        - alerts
  /v1/auth/status:
    get:
      description: Returns whether the request reached the backend through the authenticated
        KAS path.
      operationId: getV1AuthStatus
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AuthStatusResponse'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
      summary: Get authentication status
      tags:
        - auth
  /v1/computezones:
    get:
      description: Get list of compute zones with optional filtering and different
        view modes. Use view=detail for comprehensive metrics and view=basic for essential
        fields (ID, Name, Type, Location, Contact, timestamps). Responses include
        location and the deprecated geoLocation alias for backward compatibility.
      operationId: getV1Computezones
      parameters:
        - description: 'View mode: ''detail'' for comprehensive metrics (default)
            or ''basic'' for essential fields'
          in: query
          name: view
          schema:
            default: detail
            enum:
              - detail
              - basic
            type: string
        - description: '[DETAIL VIEW ONLY] Include metrics in response (default: true).
            Set to false for better performance when metrics are not needed.'
          in: query
          name: includeMetrics
          schema:
            default: true
            type: boolean
        - description: List of compute zone IDs to filter (comma-separated)
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Page number (0-indexed)
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Page size
          in: query
          name: pageSize
          schema:
            default: 20
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/models.ComputeZonesResponse'
                  - $ref: '#/components/schemas/models.ListComputeZonesResponse'
          description: Basic view response (view=basic)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Service Unavailable
      summary: Get compute zones
      tags:
        - computezones
    put:
      description: Admin updates compute zone type and metadata. Compute zone names
        are agent-managed and cannot be changed from customer-api. Use location; geoLocation
        remains accepted as a deprecated alias. If both are supplied, they must be
        identical.
      operationId: putV1Computezones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.UpdateComputeZoneRequest'
              summary: request
              description: Update compute zone request
        description: Update compute zone request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.UpdateComputeZoneResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
