info:
  title: Fleet Intelligence API (external)
  version: ''
externalDocs:
  description: ''
  url: ''
openapi: 3.1.0
paths:
  /v1/alert_timeline/nodes:
    get:
      description: Get list of nodes with alert summary for progressive disclosure.
        Returns hostname, host status (unhealthy if any active alerts, fixed otherwise),
        and last alert time. This is the first level of the progressive disclosure
        API for alert timelines. Currently returns all historical alert data (time
        filtering will be added in future).
      operationId: getV1AlertTimelineNodes
      parameters:
        - description: 'Filter only nodes with active alerts (default: false)'
          in: query
          name: active
          schema:
            default: false
            type: boolean
        - description: 'Page number (0-indexed, default: 0)'
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: 'Number of nodes per page (default: 50, max: 100)'
          in: query
          name: pageSize
          schema:
            default: 50
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AlertTimelineNodesResponse'
          description: List of nodes with alert summary
        '400':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Bad Request - Invalid parameters
        '401':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Internal Server Error
      summary: GET nodes in alert audit table - all the nodes ever had alerts (level
        1)
      tags:
        - alerts
  /v1/alert_timeline/nodes/{nodeUUID}/alerts:
    get:
      description: Get list of alerts for a specific node. Returns alert UUID, component,
        alert status (active/resolved), and last event time. Use the 'active' parameter
        to filter between all alerts or only currently active alerts. This is the
        second level of the progressive disclosure API for alert timelines. Currently
        returns all historical alert data (time filtering will be added in future).
      operationId: getV1AlertTimelineNodesNodeUuidAlerts
      parameters:
        - description: Node UUID
          in: path
          name: nodeUUID
          required: true
          schema:
            type: string
        - description: 'Filter only currently active alerts (default: false)'
          in: query
          name: active
          schema:
            default: false
            type: boolean
        - description: 'Page number (0-indexed, default: 0)'
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: 'Number of alerts per page (default: 50, max: 100)'
          in: query
          name: pageSize
          schema:
            default: 50
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AlertTimelineNodeAlertsResponse'
          description: List of alerts for the node
        '400':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Bad Request - Invalid UUID
        '401':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Node Not Found
        '500':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Internal Server Error
      summary: Get alerts for a specific node (level 2)
      tags:
        - alerts
  /v1/alert_timeline/nodes/{nodeUUID}/alerts/{alertUUID}:
    get:
      description: Get complete timeline for a specific alert. Returns alert UUID,
        component, and complete event timeline. This is the third level of the progressive
        disclosure API for alert timelines.
      operationId: getV1AlertTimelineNodesNodeUuidAlertsAlertUuid
      parameters:
        - description: Node UUID
          in: path
          name: nodeUUID
          required: true
          schema:
            type: string
        - description: Alert UUID
          in: path
          name: alertUUID
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AlertTimelineDetailResponse'
          description: Complete timeline for the alert
        '400':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Bad Request - Invalid UUID format
        '401':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Alert Not Found
        '500':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Internal Server Error
      summary: Get complete timeline for a specific alert (level 3)
      tags:
        - alerts
  /v1/alerts:
    get:
      description: Get list of alerts with optional filtering by node, component,
        state, and severity
      operationId: getV1Alerts
      parameters:
        - description: Filter by node UUID
          in: query
          name: nodeUUID
          schema:
            type: string
        - description: Filter by component name
          in: query
          name: component
          schema:
            type: string
        - description: Filter by alert state (Detected, Triggered, Resolved)
          in: query
          name: state
          schema:
            type: string
        - description: Filter by alert severity (Critical, Warning)
          in: query
          name: severity
          schema:
            type: string
        - description: 'Page number (default: 1)'
          in: query
          name: page
          schema:
            default: 1
            type: integer
        - description: 'Page size (default: 50, max: 100)'
          in: query
          name: pageSize
          schema:
            default: 50
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AlertResponse'
          description: Array of alerts with pagination info
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get alerts
      tags:
        - alerts
  /v1/alerts/{nodeUUID}:
    get:
      description: Get list of alerts for a specific node (machine) identified by
        nodeUUID, grouped by component
      operationId: getV1AlertsNodeUuid
      parameters:
        - description: Node UUID (machine ID)
          in: path
          name: nodeUUID
          required: true
          schema:
            type: string
        - description: Filter by component name
          in: query
          name: component
          schema:
            type: string
        - description: Filter by alert state (Detected, Triggered, Resolved)
          in: query
          name: state
          schema:
            type: string
        - description: Filter by alert severity (Critical, Warning)
          in: query
          name: severity
          schema:
            type: string
        - description: 'Page number (default: 1)'
          in: query
          name: page
          schema:
            default: 1
            type: integer
        - description: 'Page size (default: 50, max: 100)'
          in: query
          name: pageSize
          schema:
            default: 50
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.NodeAlertResponse'
          description: Alerts grouped by component with pagination info
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Node Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get alerts for a specific node
      tags:
        - alerts
  /v1/computezones:
    get:
      description: Get list of compute zones with optional filtering and different
        view modes. Use view=detail for comprehensive metrics and view=basic for essential
        fields (ID, Name, Type, GeoLocation, Contact, timestamps)
      operationId: getV1Computezones
      parameters:
        - description: 'View mode: ''detail'' for comprehensive metrics (default)
            or ''basic'' for essential fields'
          in: query
          name: view
          schema:
            default: detail
            enum:
              - detail
              - basic
            type: string
        - description: '[DETAIL VIEW ONLY] Include metrics in response (default: true).
            Set to false for better performance when metrics are not needed.'
          in: query
          name: includeMetrics
          schema:
            default: true
            type: boolean
        - description: List of compute zone IDs to filter (comma-separated)
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: 'Page number (default: 0)'
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: 'Page size (default: 20, max: 100)'
          in: query
          name: pageSize
          schema:
            default: 20
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/models.ComputeZonesResponse'
                  - $ref: '#/components/schemas/models.ListComputeZonesResponse'
          description: Basic view response (view=basic)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Service Unavailable
      summary: Get compute zones
      tags:
        - computezones
    put:
      description: Admin updates compute zone type and metadata. Compute zone names
        are agent-managed and cannot be changed from customer-api.
      operationId: putV1Computezones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.UpdateComputeZoneRequest'
              summary: request
              description: Update compute zone request
        description: Update compute zone request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.UpdateComputeZoneResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Update compute zone
      tags:
        - computezones
  /v1/nodegroups:
    get:
      description: 'Get list of node groups with optional filtering and different
        view modes. Use view=detail for comprehensive metrics and view=basic for minimal
        ID/Name list. Detail view supports additional filters: computeZoneNames (partial
        match), healthStatuses, and gpuTypes'
      operationId: getV1Nodegroups
      parameters:
        - description: 'View mode: ''detail'' for comprehensive metrics (default)
            or ''basic'' for minimal list'
          in: query
          name: view
          schema:
            default: detail
            enum:
              - detail
              - basic
            type: string
        - description: '[DETAIL VIEW ONLY] Include metrics in response (default: true).
            Set to false for better performance when metrics are not needed.'
          in: query
          name: includeMetrics
          schema:
            default: true
            type: boolean
        - description: Filter by compute zone IDs (e.g., ?computeZoneIds=id1&computeZoneIds=id2)
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: '[DETAIL VIEW ONLY] Filter by compute zone names with partial
            match (e.g., ?computeZoneNames=east&computeZoneNames=west)'
          in: query
          name: computeZoneNames
          schema:
            items:
              type: string
            type: array
        - description: '[LEGACY] Single compute zone ID to filter node groups - use
            computeZoneIds instead'
          in: query
          name: computeZoneId
          schema:
            type: string
        - description: List of node group IDs to filter (e.g., ?nodeGroupIds=id1&nodeGroupIds=id2)
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: '[DETAIL VIEW ONLY] Filter by node health status values (e.g.,
            ?healthStatuses=Healthy&healthStatuses=Degraded)'
          in: query
          name: healthStatuses
          schema:
            items:
              enum:
                - Healthy
                - Degraded
                - Unhealthy
                - Unknown
              type: string
            type: array
        - description: '[DETAIL VIEW ONLY] Filter by GPU type values (e.g., ?gpuTypes=NVIDIA-H100-80GB-HBM3)'
          in: query
          name: gpuTypes
          schema:
            items:
              type: string
            type: array
        - description: Field to sort by (health, gpuUtil, nodes)
          in: query
          name: sortBy
          schema:
            default: health
            enum:
              - health
              - gpuUtil
              - nodes
            type: string
        - description: Sort order (asc, desc)
          in: query
          name: order
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - description: 'Page number (default: 0)'
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: 'Page size (default: 20, max: 100)'
          in: query
          name: pageSize
          schema:
            default: 20
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/models.NodeGroupsResponse'
                  - $ref: '#/components/schemas/models.ListNodeGroupsResponse'
          description: Basic view response (view=basic)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Service Unavailable
      summary: Get node groups
      tags:
        - nodegroups
  /v1/nodegroups/options:
    get:
      description: 'Returns available filters and sorting options for querying node
        groups.

        Filter options may be simple strings (e.g., health statuses, GPU types) or
        hierarchical objects (e.g., compute zones with nested nodegroups).


        Filter options examples:

        - Simple strings: `{"name": "healthStatuses", "options": ["Healthy", "Degraded",
        "Unhealthy"]}`

        - Hierarchical objects: `{"name": "computeZones", "options": [{"id": "cz-1",
        "value": "Zone 1", "options": [{"id": "ng-1", "value": "Node Group 1"}]}]}`'
      operationId: getV1NodegroupsOptions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Options'
          description: Available query options including filters and sorting configuration
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get available query options for node groups
      tags:
        - nodegroups
  /v1/nodes:
    delete:
      description: Soft delete multiple nodes by setting the deleted flag to true
      operationId: deleteV1Nodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.DeleteNodesRequest'
              summary: request
              description: List of node UUIDs to delete
        description: List of node UUIDs to delete
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Service Unavailable
      summary: Delete multiple nodes (soft delete)
      tags:
        - nodes
    get:
      description: Get list of nodes with current state and overview. Use view=detail
        (default) for full response or view=basic for a lightweight nodeUUID + hostname
        list (see models.BasicNodesResponse). All filter parameters are optional arrays
        - empty means no filter applied.
      operationId: getV1Nodes
      parameters:
        - description: 'View mode: ''detail'' for full response (default) or ''basic''
            for nodeUUID + hostname only (lightweight query, does not support filtering
            or sorting by healthStatuses, integrityChecks, firmwareChecks, or agentStatuses).'
          in: query
          name: view
          schema:
            default: detail
            enum:
              - detail
              - basic
            type: string
        - description: Page number
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Page size
          in: query
          name: pageSize
          schema:
            default: 10
            type: integer
        - description: Filter by specific node UUIDs. Empty means all nodes
          in: query
          name: nodeUUIDs
          schema:
            items:
              type: string
            type: array
        - description: Filter by health status values
          in: query
          name: healthStatuses
          schema:
            items:
              enum:
                - Healthy
                - Degraded
                - Unhealthy
                - Unknown
              type: string
            type: array
        - description: Filter by computezone IDs. Empty means all computezones
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by computezone names (partial match). Empty means all
            computezones
          in: query
          name: computeZoneNames
          schema:
            items:
              type: string
            type: array
        - description: Filter by nodegroup IDs. Empty means all nodegroups
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by nodegroup names (partial match). Empty means all
            nodegroups
          in: query
          name: nodeGroupNames
          schema:
            items:
              type: string
            type: array
        - description: Filter by GPU type values. Empty means all GPU types
          in: query
          name: gpuTypes
          schema:
            items:
              type: string
            type: array
        - description: Filter by GPU count values. Empty means all GPU counts
          in: query
          name: gpuCounts
          schema:
            items:
              type: integer
            type: array
        - description: Filter by public IP addresses. Empty means all public IPs
          in: query
          name: publicIPs
          schema:
            items:
              type: string
            type: array
        - description: Filter by private IP addresses. Empty means all private IPs
          in: query
          name: privateIPs
          schema:
            items:
              type: string
            type: array
        - description: Filter by integrity check status
          in: query
          name: integrityChecks
          schema:
            items:
              enum:
                - Verified
                - Unverified
                - Degraded
                - Pending
                - Unsupported
                - Unknown
              type: string
            type: array
        - description: Filter by firmware check status
          in: query
          name: firmwareChecks
          schema:
            items:
              enum:
                - Passed
                - Failed
                - Unknown
              type: string
            type: array
        - description: Filter by agent status values
          in: query
          name: agentStatuses
          schema:
            items:
              enum:
                - Online
                - Offline
                - Unknown
              type: string
            type: array
        - description: Filter by hostname (case-insensitive partial match)
          in: query
          name: hostname
          schema:
            type: string
        - description: Field to sort by
          in: query
          name: sortBy
          schema:
            default: hostname
            enum:
              - hostname
              - nodeUUID
              - healthStatus
              - nodegroup
              - computezone
              - gpuType
              - gpuCount
              - integrityCheck
              - agentStatus
            type: string
        - description: Sort order (asc, desc)
          in: query
          name: order
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/models.NodesResponse'
                  - $ref: '#/components/schemas/models.BasicNodesResponse'
          description: Basic view response (view=basic)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Service Unavailable
      summary: Get nodes overview and states
      tags:
        - nodes
  /v1/nodes/options:
    get:
      description: 'Returns available filters and sorting options for querying nodes.

        Filter options may be simple strings (e.g., health statuses) or hierarchical
        objects (e.g., compute zones with nested nodegroups).


        Filter options examples:

        - Simple strings: `{"name": "healthStatuses", "options": ["Healthy", "Degraded",
        "Unhealthy"]}`

        - Hierarchical objects: `{"name": "computeZones", "options": [{"id": "cz-1",
        "value": "Zone 1", "options": [{"id": "ng-1", "value": "Node Group 1"}]}]}`'
      operationId: getV1NodesOptions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Options'
          description: Available query options including filters and sorting configuration
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get available query options for nodes
      tags:
        - nodes
  /v1/nodes/{nodeUUID}:
    delete:
      description: Soft delete a node by setting the deleted flag to true
      operationId: deleteV1NodesNodeUuid
      parameters:
        - description: Node UUID
          in: path
          name: nodeUUID
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
