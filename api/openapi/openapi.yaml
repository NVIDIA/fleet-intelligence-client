        - not_enrolled
      example: online
      type: string
      x-enum-varnames:
        - AlertAgentStatusOnline
        - AlertAgentStatusOffline
        - AlertAgentStatusNotEnrolled
    models.AlertAgentStatuses:
      description: 'AgentStatus contains source-specific liveness and timestamps.
        Each source''s

        lastSeenAt follows the Nodes API precedence: active liveness alert detectedAt,

        liveness health-state updatedAt, then its inventory row updatedAt.'
      properties:
        inband:
          $ref: '#/components/schemas/models.AlertAgentSourceStatus'
        oob:
          $ref: '#/components/schemas/models.AlertAgentSourceStatus'
      type: object
    models.AlertEventType:
      enum:
        - detected
        - triggered
        - resolved
        - retriggered
        - severity_changed
        - metadata_updated
        - notify_sent
        - notify_failed
        - muted
        - unmuted
        - burst_analyzed
      type: string
      x-enum-comments:
        AlertEventBurstAnalyzed: XID burst analysis result attached to alert
        AlertEventDetected: First detection (no severity yet)
        AlertEventMetadataUpdated: Message, error, extra_info changed
        AlertEventMuted: Alert was muted
        AlertEventNotifyFailed: Notification failed
        AlertEventNotifySent: Notification sent successfully
        AlertEventResolved: Issue fixed, alert closed
        AlertEventRetriggered: historical audit entries only
        AlertEventSeverityChanged: Warning ↔ Critical
        AlertEventTriggered: Alert activated with severity
        AlertEventUnmuted: Alert was unmuted
      x-enum-varnames:
        - AlertEventDetected
        - AlertEventTriggered
        - AlertEventResolved
        - AlertEventRetriggered
        - AlertEventSeverityChanged
        - AlertEventMetadataUpdated
        - AlertEventNotifySent
        - AlertEventNotifyFailed
        - AlertEventMuted
        - AlertEventUnmuted
        - AlertEventBurstAnalyzed
    models.AlertOverview:
