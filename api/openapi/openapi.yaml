          type: string
        triggeredAt:
          type: string
      required:
        - alertUUID
        - nodeUUID
      type: object
    models.AlertAgentSourceStatus:
      properties:
        lastSeenAt:
          example: '2026-09-15T20:30:00Z'
          type: string
        status:
          $ref: '#/components/schemas/models.AlertAgentStatus'
      type: object
    models.AlertAgentStatus:
      enum:
        - online
