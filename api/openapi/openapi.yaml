    models.MetricSeriesData:
      properties:
        displayLabel:
          description: 'DisplayLabel is the preferred label value for UI display (e.g.,
            GPU index for DCGM metrics).

            Derived from the "gpu" key if present, otherwise falls back to "gpu_uuid".

            Omitted for aggregated levels where labels are not present.'
          example: GPU 0
          type: string
        label:
          additionalProperties:
            type: string
          description: 'Label contains identifying information (e.g., GPU UUID) for
            node-level queries.

            Omitted for aggregated levels (customer/nodegroup/computezone).

            Typical keys: "gpu" (GPU index), "uuid" (GPU UUID).'
          type: object
        values:
          description: 'Values is a 2D array where each inner array contains [unix_timestamp,
            metric_value]

            This follows the Prometheus/Grafana standard format for compatibility

            The last element in the array represents the most recent/latest value

            Example: [[1705276800, 0.723], [1705277100, 0.741]]

            NOTE: swaggertype:"string" is a workaround for swag limitations with nested
            arrays'
          example: '[[1705276800, 0.723], [1705277100, 0.741]]'
          type: string
      type: object
