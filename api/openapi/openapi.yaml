components:
  schemas:
    models.ActionPersona:
      description: Target persona (stored in DB, stripped before API response)
      enum:
        - tenant
        - dc_admin
      type: string
      x-enum-varnames:
        - ActionPersonaTenant
        - ActionPersonaDCAdmin
    models.ActionType:
      description: 'Action type: "immediate" or "investigatory"'
      enum:
        - immediate
        - investigatory
      example: immediate
      type: string
      x-enum-varnames:
        - ActionTypeImmediate
        - ActionTypeInvestigatory
    models.AgentStatus:
      enum:
        - Online
        - Offline
        - Unknown
      example: Online
      type: string
      x-enum-varnames:
        - AgentStatusOnline
        - AgentStatusOffline
        - AgentStatusUnknown
    models.Aggregation:
      enum:
        - average
        - sum
        - min
        - max
        - none
      example: average
      type: string
