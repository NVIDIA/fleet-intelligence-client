        - description: End time for filtering nodes active during period (RFC3339
            format, e.g., 2024-12-31T23:59:59Z)
          in: query
          name: endTime
          schema:
            type: string
        - description: 'Field to sort by. In-band fields: hostname, gpuType, gpuCount,
            publicIP, privateIP. OOB fields: nodeName, bmcHostname, bmcIP. Shared
            fields: nodeUUID, nodeGroup, computeZone, verificationCheck, location.
