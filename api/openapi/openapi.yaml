          in: query
          name: pageSize
          schema:
            default: 10
            type: integer
        - description: Response format (json or csv)
          in: query
          name: format
          schema:
            default: json
            enum:
              - json
              - csv
            type: string
        - description: Sign the CSV with NVIDIA's signing key and return a zip containing
            the CSV plus a .sig.bundle (cosign-verifiable Sigstore bundle). Only valid
            with format=csv.
          in: query
          name: signed
          schema:
            default: false
            type: boolean
        - description: Filter by computezone IDs. Empty means all computezones
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by nodegroup IDs. Empty means all nodegroups
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by tags. Empty means all tags
          in: query
          name: tags
          schema:
            items:
              type: string
            type: array
        - description: Start time for filtering nodes active during period (RFC3339
            format, e.g., 2024-01-01T00:00:00Z)
          in: query
          name: startTime
          schema:
            type: string
        - description: End time for filtering nodes active during period (RFC3339
            format, e.g., 2024-12-31T23:59:59Z)
          in: query
          name: endTime
          schema:
            type: string
        - description: Field to sort by
          in: query
          name: sortBy
          schema:
            default: hostname
            enum:
              - hostname
              - nodeUUID
              - nodegroup
              - computezone
              - gpuType
              - gpuCount
              - publicIP
              - privateIP
              - integrityCheck
              - geoLocation
            type: string
        - description: Sort order (asc, desc)
          in: query
          name: order
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/models.InventoryReportResponse'
                  - type: string
            application/zip:
              schema:
                $ref: '#/components/schemas/models.InventoryReportResponse'
            text/csv:
              schema:
                type: string
          description: JSON response (default). For CSV download, use format=csv query
            parameter. For signed CSV, use format=csv&signed=true (returns application/zip).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
            application/zip:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
            application/zip:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
            application/zip:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
            application/zip:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
            application/zip:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Service Unavailable
      summary: Get inventory report
      tags:
        - reports
