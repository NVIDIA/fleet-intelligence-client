    get:
      description: Get list of nodes with current state and overview. Use view=detail
        (default) for full response or view=basic for a lightweight nodeUUID + hostname/BMC
        identity list, including the optional OOB nodeName when OOB data is selected
        (see models.BasicNodesResponse). Detail responses include the preferred verification-check
        fields and the deprecated integrityCheck aliases for backward compatibility.
        All filter parameters are optional arrays - empty means no filter applied.
      operationId: getV1Nodes
      parameters:
        - description: 'View mode: ''detail'' for full response (default) or ''basic''
            for nodeUUID + hostname + optional OOB nodeName + bmcHostname/bmcIP only
            (lightweight query, does not support filtering or sorting by healthStatuses,
            verificationChecks, firmwareChecks, or agentStatuses).'
          in: query
          name: view
          schema:
            default: detail
            enum:
              - detail
              - basic
            type: string
        - description: 'Select the in-band or OOB (BMC/Redfish) view: returns only
            nodes enrolled by that agent type. nodeName is source-specific metadata
            configured on the OOB collector and is absent from in-band responses.
            In the OOB view, nodes expose nodeName, bmcHostname/bmcIP and BMC-based
            verification, while publicIP/privateIP/kernelVersion/gpuDriverVersion/gpuType/gpuCount/gpuFirmwareVersions
            are empty. Empty defaults to the in-band view for view=detail; for view=basic,
            an empty agentType returns a combined view that merges the OOB nodeName
            and BMC identity alongside the in-band hostname.'
          in: query
          name: agentType
          schema:
            default: inband
            enum:
              - inband
              - oob
            type: string
        - description: Page number (0-indexed)
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Page size
          in: query
          name: pageSize
          schema:
            default: 10
            type: integer
        - description: Filter by specific node UUIDs. Empty means all nodes
          in: query
          name: nodeUUIDs
          schema:
            items:
              type: string
            type: array
        - description: Filter by health status values
          in: query
          name: healthStatuses
          schema:
            items:
              enum:
                - Healthy
                - Degraded
                - Unhealthy
                - Unknown
              type: string
            type: array
        - description: Filter by computezone IDs. Empty means all computezones
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by computezone names (partial match). Empty means all
            computezones
          in: query
          name: computeZoneNames
          schema:
            items:
              type: string
            type: array
        - description: Filter by nodegroup IDs. Empty means all nodegroups
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by nodegroup names (partial match). Empty means all
            nodegroups
          in: query
          name: nodeGroupNames
          schema:
            items:
              type: string
            type: array
        - description: Filter by GPU type values. Empty means all GPU types
          in: query
          name: gpuTypes
          schema:
            items:
              type: string
            type: array
        - description: Filter by GPU count values. Empty means all GPU counts
          in: query
          name: gpuCounts
          schema:
            items:
              type: integer
            type: array
        - description: Filter by public IP addresses. Empty means all public IPs
          in: query
          name: publicIPs
          schema:
            items:
              type: string
            type: array
        - description: Filter by private IP addresses. Empty means all private IPs
          in: query
          name: privateIPs
          schema:
            items:
              type: string
            type: array
        - description: Filter by verification-check status. Takes precedence when
            both verificationChecks and deprecated integrityChecks are supplied.
          in: query
          name: verificationChecks
          schema:
            items:
              $ref: '#/components/schemas/models.IntegrityCheck'
            type: array
        - description: 'Deprecated: use verificationChecks.'
          in: query
          name: integrityChecks
          schema:
            items:
              $ref: '#/components/schemas/models.IntegrityCheck'
            type: array
          deprecated: true
        - description: Filter by firmware check status
          in: query
          name: firmwareChecks
          schema:
            items:
              $ref: '#/components/schemas/models.FirmwareCheck'
            type: array
        - description: Filter by agent status values
          in: query
          name: agentStatuses
          schema:
            items:
              $ref: '#/components/schemas/models.AgentStatus'
            type: array
        - description: Case-insensitive substring search across nodeUUID and source-appropriate
            node identity fields. Searches nodeUUID or hostname for agentType=inband;
            nodeUUID, nodeName, or bmcHostname for agentType=oob; and nodeUUID plus
            all three names for the combined basic view (view=basic with agentType
            omitted). Leading and trailing whitespace is ignored; blank means no search.
          in: query
          name: search
          schema:
            type: string
        - description: Filter by the in-band OS hostname (case-insensitive partial
            match). Applies to the in-band view and to active in-band identities in
            the combined basic view; ignored in the OOB view.
          in: query
          name: hostname
          schema:
            type: string
        - description: Filter by the configured node name (case-insensitive partial
            match). Applies only to the OOB view (agentType=oob); ignored in the in-band
            and combined views.
          in: query
          name: nodeName
          schema:
            type: string
        - description: Filter by BMC hostname (case-insensitive partial match). Applies
            only to the OOB view (agentType=oob); ignored in the in-band and combined
            views.
          in: query
          name: bmcHostname
          schema:
            type: string
        - description: Field to sort by. Use verificationCheck; integrityCheck remains
            a deprecated alias. Defaults to hostname (in-band view) or bmcHostname
            (OOB view). nodeName and bmcHostname apply only to OOB-capable views;
            the in-band-only GPU/kernel/driver/agentVersion keys apply only to the
            in-band view — a key not valid for the selected view falls back to the
            view's default. gpuFirmwareVersions pins nodes whose GPUs have mismatched
            vbios versions to the top, then sorts the remaining (uniform) nodes by
            that common vbios in the requested order.
          in: query
          name: sortBy
          schema:
            default: hostname
            enum:
              - hostname
              - nodeName
              - nodeUUID
              - healthStatus
              - nodegroup
              - computezone
              - gpuType
              - gpuCount
              - verificationCheck
              - integrityCheck
              - agentStatus
              - agentVersion
              - kernelVersion
              - gpuDriverVersion
              - gpuFirmwareVersions
              - bmcHostname
            type: string
        - description: Sort order (asc, desc)
          in: query
          name: order
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/models.InbandNodesResponse'
                  - $ref: '#/components/schemas/models.OobNodesResponse'
                  - $ref: '#/components/schemas/models.BasicNodesResponse'
          description: Basic view response (view=basic)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
