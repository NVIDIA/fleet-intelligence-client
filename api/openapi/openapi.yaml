  /v1/xid/bursts:
    get:
      description: 'Returns the flat finalized-burst table for the authenticated customer.
        Results default to startTime descending (latest first), with burstId descending
        as the stable pagination tie-breaker.

        The selected time range applies to burst start time using [startTime, endTime)
        and is required, matching GET /v1/events. Relative mode requires timeMode=relative
        and a positive Go duration window; absolute mode (default) requires startTime
        and endTime. Do not combine window with startTime/endTime. Absolute endTime
        must be after startTime.

        Node-group and compute-zone filters use customer-scoped UUIDs, matching the
        node and alert APIs. Values are OR-combined within each dimension and AND-combined
        across dimensions. Exclusion filters select every assignment except the supplied
        IDs and cannot be combined with the inclusive filter for the same dimension.
        Filter option IDs and labels are available from GET /v1/nodes/options. Bursts
        on soft-deleted nodes are never returned.

        Multiple xidNumbers are OR-combined: a burst matches if it contains any of
        the requested XIDs (including bursts that contain only one of them, or both).
        String search parameters are case-insensitive substring filters. Categories,
        subcategories, and action-code array parameters (e.g. tenantActions) are exact-match
        checkbox-style filters, OR-combined within the same parameter; their values
        come from GET /v1/xid/bursts/options. All filters across different columns/parameters
        are AND-combined, including a *Search param and its exact-match sibling. Action
        filters and searches match catalog action codes (not Guidance Classes text)
        and expand public alias codes (e.g. CONTACT_SUPPORT) to the raw DB forms they
        replace (RETURN_TO_PROVIDER, PULL_FROM_SERVICE), so options-published codes
        match stored bursts.

        Response fields are shaped server-side from the caller''s persona. Tenants
        receive jobDisruption, XID numbers with mnemonics, and tenant actions. Cloud-provider/NCP
        callers additionally receive category, subcategory, jobDisruptionDueToPlatformIssue,
        XID catalog descriptions, and DC-admin actions. Action text is resolved from
        the persona-appropriate Guidance Classes catalog. Each item includes nodeUuid,
        the node''s resolved GPU type, identities, and current nodeGroup/computeZone.
        GPU type is independent of the selected burst data source.

        Bursts are detected independently on each observation path, selected by dataSource:
        in-band agent logs (default), out-of-band BMC/Redfish logs, or all for both
        in one page. Each item echoes the single source that detected it, so on a
        combined page a node that reported the same fault through both paths appears
        as two rows with different dataSource values — that is the observation, not
        a duplicate to be merged. Sorting and paging are identical for every dataSource.
        Every item also carries all three node identities (hostname, nodeName, bmcHostname);
        each is empty unless the source owning it is currently enrolled, so an out-of-band-only
        node usually has no hostname and sorts as empty under sortBy=hostname. nameSearch
        matches any of the three. For out-of-band bursts the deviceIds keys are resolved
        from the Redfish resource token to the GPU UUID where inventory allows, and
        otherwise remain the raw token, so treat the key as an opaque device label.'
      operationId: getV1XIDBursts
      parameters:
        - description: Observation source to list bursts from, or all for both
          in: query
          name: dataSource
          schema:
            default: inband
            enum:
              - inband
              - oob
              - all
            type: string
        - description: Start time in RFC3339 format (required for absolute mode, e.g.
            2024-01-01T01:00:00Z).
          in: query
          name: startTime
          schema:
            type: string
        - description: End time in RFC3339 format (required for absolute mode). Must
            be after startTime.
          in: query
          name: endTime
          schema:
            type: string
        - description: Time mode for range selection. Defaults to absolute.
          in: query
          name: timeMode
          schema:
            enum:
              - absolute
              - relative
            type: string
        - description: Relative duration window (required for relative mode). Uses
            Go duration units h, m, and s; use 168h for 7 days ('d' is not supported)
          in: query
          name: window
          schema:
            type: string
        - description: Filter by node UUID
          in: query
          name: nodeUUID
          schema:
            type: string
        - description: Filter to nodes in matching node groups by node group ID (OR
            within dimension)
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Filter to nodes in matching compute zones by compute zone ID
            (OR within dimension)
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Exclude nodes in matching node groups by node group ID (OR
            within dimension; cannot be combined with nodeGroupIds)
          in: query
          name: excludeNodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Exclude nodes in matching compute zones by compute zone ID
            (OR within dimension; cannot be combined with computeZoneIds)
          in: query
          name: excludeComputeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Filter by the public fatal-XID job-disruption definition
          in: query
          name: jobDisruption
          schema:
            type: boolean
        - description: Filter by analyzer platform-attributed disruption (cloud-provider/NCP
            only)
          in: query
          name: jobDisruptionDueToPlatformIssue
          schema:
            type: boolean
        - description: Exact XID numbers; burst matches if it contains any of them
            (OR semantics)
          in: query
          name: xidNumbers
          schema:
            items:
              type: integer
            type: array
        - description: Resolved node GPU types; independent of dataSource
          in: query
          name: gpuTypes
          schema:
            items:
              type: string
            type: array
        - description: 'Case-insensitive substring matched against any of the node''s
            identities: hostname, nodeName, or bmcHostname. Takes precedence when
            both nameSearch and deprecated hostnameSearch are supplied.'
          in: query
          name: nameSearch
          schema:
            type: string
        - description: 'Deprecated: use nameSearch. Identical behavior; it never matched
            hostname alone.'
          in: query
          name: hostnameSearch
          schema:
            type: string
          deprecated: true
        - description: Case-insensitive category substring (cloud-provider/NCP only)
          in: query
          name: categorySearch
          schema:
            type: string
        - description: Case-insensitive subcategory substring (cloud-provider/NCP
            only)
          in: query
          name: subcategorySearch
          schema:
            type: string
        - description: Case-insensitive tenant immediate-action code substring
          in: query
          name: tenantActionSearch
          schema:
            type: string
        - description: Case-insensitive tenant investigatory-action code substring
          in: query
          name: tenantInvestigationSearch
          schema:
            type: string
        - description: Case-insensitive DC-admin immediate-action code substring (cloud-provider/NCP
            only)
          in: query
          name: dcAdminActionSearch
          schema:
            type: string
        - description: Case-insensitive DC-admin investigatory-action code substring
            (cloud-provider/NCP only)
          in: query
          name: dcAdminInvestigationSearch
          schema:
            type: string
        - description: Exact category values from GET /v1/xid/bursts/options; OR-combined
            (cloud-provider/NCP only)
          in: query
          name: categories
          schema:
            items:
              type: string
            type: array
        - description: Exact subcategory values from GET /v1/xid/bursts/options; OR-combined
            (cloud-provider/NCP only)
          in: query
          name: subcategories
          schema:
            items:
              type: string
            type: array
        - description: Exact tenant immediate-action codes from GET /v1/xid/bursts/options;
            OR-combined
          in: query
          name: tenantActions
          schema:
            items:
              type: string
            type: array
        - description: Exact tenant investigatory-action codes from GET /v1/xid/bursts/options;
            OR-combined
          in: query
          name: tenantInvestigations
          schema:
            items:
              type: string
            type: array
        - description: Exact DC-admin immediate-action codes from GET /v1/xid/bursts/options;
            OR-combined (cloud-provider/NCP only)
          in: query
          name: dcAdminActions
          schema:
            items:
              type: string
            type: array
        - description: Exact DC-admin investigatory-action codes from GET /v1/xid/bursts/options;
            OR-combined (cloud-provider/NCP only)
          in: query
          name: dcAdminInvestigations
          schema:
            items:
              type: string
            type: array
        - description: Sortable table column (cloud-provider/NCP only for jobDisruptionDueToPlatformIssue,
            category, subcategory, dcAdminAction, dcAdminInvestigation)
          in: query
          name: sortBy
          schema:
            default: startTime
            enum:
              - jobDisruption
              - jobDisruptionDueToPlatformIssue
              - category
              - subcategory
              - xidNumbers
              - xidCount
              - burstDurationSeconds
              - nodeUuid
              - dataSource
              - hostname
              - nodeName
              - bmcHostname
              - gpuType
              - nodeGroup
              - computeZone
              - startTime
              - dcAdminAction
              - dcAdminInvestigation
              - tenantAction
              - tenantInvestigation
            type: string
        - description: Sort direction
          in: query
          name: sortOrder
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - description: Page number (0-indexed)
          in: query
          name: page
          schema:
            default: 0
            type: integer
        - description: Page size (1-100)
          in: query
          name: pageSize
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.XIDBurstsListResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Invalid filter, time range, sort, or pagination
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied or NCP-only filter requested
            by tenant
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: List finalized XID bursts
      tags:
        - xid
  /v1/xid/bursts/options:
    get:
      description: 'Returns filter options available to the authenticated customer
        and persona. Optional time and inventory scope filters narrow the values;
        table column filters are not applied. This v1 response contains no counts
        and has no cross-filter impact-count behavior.

        Tenant callers receive public disruption values, XIDs, and tenant actions.
        Cloud-provider/NCP callers additionally receive platform-disruption values,
        categories, subcategories, and DC-admin actions. suggestedActions uses the
        shared action model; clients group it by persona and type. Category and action
        labels are resolved from the persona-appropriate catalogs.

        jobDisruption and jobDisruptionDueToPlatformIssue are always the full [true,
        false] domain. XID numbers, categories, subcategories, and suggestedActions
        reflect the distinct values actually present across the customer''s finalized
        bursts (still unfiltered by the current table filters). Action codes are alias-normalized
        and de-duplicated after normalization, matching GET /v1/xid/bursts. Hostname
        filtering uses the free-text nameSearch parameter on GET /v1/xid/bursts rather
        than a distinct-hostname options list.

        Options are scoped by dataSource and echoed in the response, so they always
        match what GET /v1/xid/bursts returns for that same value. Request them again
        when switching sources, and pass dataSource=all when the table itself was
        fetched with dataSource=all. GPU type options use each matching node''s resolved
        GPU type, independent of which source detected the burst.'
      operationId: getV1XIDBurstOptions
      parameters:
        - description: Optional RFC3339 start time
          in: query
          name: startTime
          schema:
            type: string
        - description: Optional RFC3339 end time
          in: query
          name: endTime
          schema:
            type: string
        - description: Optional time mode
          in: query
          name: timeMode
          schema:
            enum:
              - absolute
              - relative
            type: string
        - description: Optional relative duration window
          in: query
          name: window
          schema:
            type: string
        - description: Node group IDs
          in: query
          name: nodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Compute zone IDs
          in: query
          name: computeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Excluded node group IDs
          in: query
          name: excludeNodeGroupIds
          schema:
            items:
              type: string
            type: array
        - description: Excluded compute zone IDs
          in: query
          name: excludeComputeZoneIds
          schema:
            items:
              type: string
            type: array
        - description: Observation source to compute options for, or all for both
          in: query
          name: dataSource
          schema:
            default: inband
            enum:
              - inband
              - oob
              - all
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.XIDBurstFilterOptionsResponse'
