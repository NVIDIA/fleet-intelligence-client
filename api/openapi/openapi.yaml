            inband or oob.'
          example: inband
          type: string
        detectedAt:
          type: string
        error:
          type: string
        eventTimestamp:
          type: string
        extraInfo:
          type: string
        incidents:
          type: string
        isMuted:
          type: boolean
        lastUpdated:
          type: string
        message:
          type: string
        mutedAt:
          type: string
        mutedBy:
          type: string
        nodeUUID:
          type: string
        severity:
          $ref: '#/components/schemas/models.AlertSeverity'
