  /v1/metrics:
    get:
      description: 'Get a list of all available metrics, organized by component. Supports
        optional filtering by isCritical, aggregatable, and type. Unknown or false
        values for boolean params are treated as no filter.

        Use psirtComponent=true to include active PSIRT CVE sub-components under the
        "psirt" component.'
      operationId: getV1Metrics
      parameters:
        - description: If 'true', only critical metrics are returned. If absent or
            'false', all metrics are returned.
          in: query
          name: isCritical
          schema:
            type: string
        - description: If 'true', metrics that cannot be aggregated across nodes are
            excluded. If absent or 'false', all metrics are returned.
          in: query
          name: aggregatable
          schema:
            type: string
        - description: If set, only metrics matching this type are returned (e.g.,
            'utilization', 'limit'). If absent, all metrics are returned.
          in: query
          name: type
          schema:
            type: string
        - description: 'Filter the catalog by data source: inband, oob, or all. Omitted
            defaults to all sources.'
          in: query
          name: dataSource
          schema:
            enum:
              - inband
              - oob
              - all
            type: string
        - description: 'Include active PSIRT CVE sub-components (default: false)'
          in: query
          name: psirtComponent
          schema:
            type: boolean
        - description: Optional entity scope. Components an entity cannot produce
            are omitted, so an empty result is the signal that a scope has no nodes
            of the requested data source. 'node' additionally filters by GPU/CPU architecture
            and probes per-sensor availability.
          in: query
          name: entityLevel
          schema:
            enum:
              - node
              - nodegroup
              - computezone
            type: string
        - description: 'Entity ID matching entityLevel: node UUID, node group UUID,
            or compute zone UUID. Required when entityLevel is set.'
          in: query
          name: entityID
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.GetMetricsResponse'
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get available metrics
      tags:
        - metrics
