          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Forbidden - UAM authorization denied
        '499':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Client Closed Request - request was canceled by the client
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
          description: Internal Server Error
      summary: Get XID burst filter options
      tags:
        - xid
  /v1/xid/bursts/{burstId}:
    get:
      description: 'Returns the side-panel details for one finalized burst belonging
        to the authenticated customer.

        Response fields are shaped server-side from the caller''s persona. Tenants
        receive the public job-disruption value, XID numbers with mnemonics, and tenant
        actions. Cloud-provider/NCP callers additionally receive category, subcategory,
        platform-attributed disruption, XID catalog descriptions, and all tenant plus
