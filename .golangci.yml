version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck # absorbed gosimple in golangci-lint v2
    - unused
  exclusions:
    # v1 applied these by default; v2 requires opting in.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - internal/generated
